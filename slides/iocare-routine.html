<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IoCare+ AI 루틴 — 프로젝트 리포트</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --border: rgba(255,255,255,0.08);
      --text: #fff;
      --muted: rgba(255,255,255,0.45);
      --accent: #3b82f6;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* --- Top bar --- */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      background: rgba(10,10,15,0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-badge {
      background: var(--accent);
      color: #fff;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 5px 12px;
      border-radius: 100px;
    }

    .header-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: -0.01em;
    }

    .header-title strong { color: var(--text); }

    .slide-counter {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* --- Main slide area --- */
    main {
      flex: 1;
      padding-top: 72px;
      padding-bottom: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .slide-viewport {
      width: 100%;
      max-width: 1100px;
      padding: 40px 24px 0;
      position: relative;
    }

    .slide-img {
      display: none;
      width: 100%;
      border-radius: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 40px 100px rgba(0,0,0,0.6);
      animation: fadeIn 0.25s ease;
    }

    .slide-img.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* --- Slide labels under image --- */
    .slide-info {
      max-width: 1100px;
      width: 100%;
      padding: 20px 24px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .slide-label {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .slide-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      margin-top: 6px;
    }

    /* --- Bottom nav bar --- */
    nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 16px 24px 24px;
      background: rgba(10,10,15,0.9);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 22px;
      border-radius: 100px;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.06);
      color: var(--text);
      transition: all 0.15s;
    }

    .nav-btn:hover:not(:disabled) {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.2);
    }

    .nav-btn:disabled {
      opacity: 0.3;
      cursor: default;
    }

    .nav-btn.primary {
      background: var(--accent);
      border-color: transparent;
    }

    .nav-btn.primary:hover { background: #2563eb; }

    /* Dot indicators */
    .dot-track {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 8px;
    }

    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--border);
      cursor: pointer;
      transition: all 0.2s;
    }

    .dot.active {
      background: var(--accent);
      width: 20px;
      border-radius: 4px;
    }

    /* --- Thumbnail strip --- */
    .thumb-strip {
      display: flex;
      gap: 10px;
      align-items: center;
      max-width: 1100px;
      width: 100%;
      padding: 20px 24px 0;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .thumb-strip::-webkit-scrollbar { display: none; }

    .thumb {
      flex-shrink: 0;
      width: 120px;
      border-radius: 10px;
      border: 2px solid transparent;
      cursor: pointer;
      opacity: 0.5;
      transition: all 0.2s;
      overflow: hidden;
    }

    .thumb:hover { opacity: 0.8; }
    .thumb.active { border-color: var(--accent); opacity: 1; }

    .thumb img {
      width: 100%;
      display: block;
    }

    /* --- Keyboard hint --- */
    .kb-hint {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.2);
      text-align: center;
      padding-top: 12px;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <span class="logo-badge">IoCare+</span>
      <div class="header-title"><strong>AI 루틴</strong> — 프로젝트 리포트</div>
    </div>
    <div class="slide-counter" id="counter">1 / 4</div>
  </header>

  <main>
    <div class="slide-viewport">
      <img class="slide-img active" src="slide-1.png" alt="AI 대화형 히어로" />
      <img class="slide-img" src="slide-2.png" alt="대담한 타이포" />
      <img class="slide-img" src="slide-3.png" alt="라이프스타일 시나리오" />
      <img class="slide-img" src="slide-4.png" alt="스마트 센서 트리거" />
    </div>

    <div class="slide-info">
      <div>
        <div class="slide-label" id="slide-label">Slide 01</div>
        <div class="slide-title" id="slide-title">AI 대화형 히어로</div>
      </div>
    </div>

    <div class="thumb-strip" id="thumb-strip">
      <div class="thumb active" onclick="goTo(0)"><img src="slide-1.png" alt="1" /></div>
      <div class="thumb" onclick="goTo(1)"><img src="slide-2.png" alt="2" /></div>
      <div class="thumb" onclick="goTo(2)"><img src="slide-3.png" alt="3" /></div>
      <div class="thumb" onclick="goTo(3)"><img src="slide-4.png" alt="4" /></div>
    </div>

    <div class="kb-hint">← → 키보드로 이동 가능</div>
  </main>

  <nav>
    <button class="nav-btn" id="btn-prev" onclick="prev()">
      ← 이전
    </button>
    <div class="dot-track" id="dots"></div>
    <button class="nav-btn primary" id="btn-next" onclick="next()">
      다음 →
    </button>
  </nav>

  <script>
    const SLIDES = [
      { label: 'Slide 01', title: 'AI 대화형 히어로' },
      { label: 'Slide 02', title: '대담한 타이포' },
      { label: 'Slide 03', title: '라이프스타일 시나리오' },
      { label: 'Slide 04', title: '스마트 센서 트리거' },
    ];

    let current = 0;
    const imgs = document.querySelectorAll('.slide-img');
    const thumbs = document.querySelectorAll('.thumb');
    const dotsEl = document.getElementById('dots');

    // Build dots
    SLIDES.forEach((_, i) => {
      const d = document.createElement('div');
      d.className = 'dot' + (i === 0 ? ' active' : '');
      d.onclick = () => goTo(i);
      dotsEl.appendChild(d);
    });

    function goTo(n) {
      imgs[current].classList.remove('active');
      thumbs[current].classList.remove('active');
      dotsEl.children[current].classList.remove('active');
      current = n;
      imgs[current].classList.add('active');
      thumbs[current].classList.add('active');
      dotsEl.children[current].classList.add('active');
      document.getElementById('counter').textContent = (current + 1) + ' / ' + SLIDES.length;
      document.getElementById('slide-label').textContent = SLIDES[current].label;
      document.getElementById('slide-title').textContent = SLIDES[current].title;
      document.getElementById('btn-prev').disabled = current === 0;
      document.getElementById('btn-next').disabled = current === SLIDES.length - 1;
      thumbs[current].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }

    function prev() { if (current > 0) goTo(current - 1); }
    function next() { if (current < SLIDES.length - 1) goTo(current + 1); }

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') prev();
      if (e.key === 'ArrowRight') next();
    });

    // Init button states
    goTo(0);
  </script>
</body>
</html>
