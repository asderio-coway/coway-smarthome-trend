<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>구독 해지 — 코웨이 스마트홈 트렌드</title>
<style>:root{--theme:#2CA3E1;--theme-soft:#e6f4fc;--theme-deep:#1a87c4;}</style>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css');
  :root {
    --font:"Pretendard Variable","Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    --bg:#fff; --bg-soft:#f5f5f7;
    --ink:#1d1d1f; --gray:#6e6e73; --gray-light:#86868b;
    --hairline:rgba(0,0,0,0.08);
    --theme:#2f9e7d; --theme-soft:#eaf6f1; --theme-deep:#1f6f59;
    --radius:16px; --radius-pill:980px;
    --shadow:0 1px 3px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.04);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--bg-soft); color:var(--ink); font-family:var(--font); -webkit-font-smoothing:antialiased; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:24px; }
  .card { background:#fff; border-radius:24px; padding:56px 48px 48px; max-width:440px; width:100%; text-align:center; box-shadow:var(--shadow); }
  .icon { font-size:52px; margin-bottom:20px; display:block; }
  .title { font-size:22px; font-weight:800; letter-spacing:-0.025em; color:var(--ink); margin-bottom:10px; word-break:keep-all; }
  .desc { font-size:15px; color:var(--gray); line-height:1.6; margin-bottom:32px; word-break:keep-all; }
  .email-badge { display:inline-block; background:var(--theme-soft); color:var(--theme-deep); font-size:14px; font-weight:600; padding:6px 14px; border-radius:var(--radius-pill); margin-bottom:8px; }
  .btn { display:inline-flex; align-items:center; gap:8px; font-size:15px; font-weight:600; color:#fff; background:var(--theme); padding:13px 28px; border-radius:var(--radius-pill); text-decoration:none; transition:background .15s ease; }
  .btn:hover { background:var(--theme-deep); }
  .btn-outline { display:inline-flex; align-items:center; font-size:14px; font-weight:500; color:var(--gray); background:transparent; padding:11px 24px; border-radius:var(--radius-pill); text-decoration:none; border:1.5px solid var(--hairline); margin-top:12px; transition:border-color .15s ease; }
  .btn-outline:hover { border-color:var(--gray-light); color:var(--ink); }
  .spinner { display:inline-block; width:36px; height:36px; border:3px solid var(--theme-soft); border-top-color:var(--theme); border-radius:50%; animation:spin .7s linear infinite; margin-bottom:20px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .actions { display:flex; flex-direction:column; align-items:center; gap:4px; }
  #stateLoading { display:block; }
  #stateDone, #stateError { display:none; }
</style>
</head>
<body>
<!-- 처리 중 -->
<div class="card" id="stateLoading">
  <span class="spinner"></span>
  <div class="title">구독 해지 처리 중…</div>
  <div class="desc">잠깐만 기다려 주세요.</div>
</div>

<!-- 완료 -->
<div class="card" id="stateDone">
  <span class="icon">✅</span>
  <div class="title">구독 해지가 완료되었습니다</div>
  <div id="doneEmail" class="email-badge"></div>
  <div class="desc" style="margin-top:12px;">더 이상 뉴스레터가 발송되지 않습니다.<br>언제든 다시 구독할 수 있습니다.</div>
  <div class="actions">
    <a href="/" class="btn">뉴스레터 홈으로</a>
  </div>
</div>

<!-- 오류 -->
<div class="card" id="stateError">
  <span class="icon">❌</span>
  <div class="title">처리에 실패했습니다</div>
  <div class="desc">잠시 후 다시 시도하거나, 아래 메일로 해지 요청해 주세요.</div>
  <div class="actions">
    <a href="mailto:asderio@coway.com?subject=구독%20해지%20요청" class="btn">메일로 해지 신청</a>
    <a href="/" class="btn-outline">홈으로</a>
  </div>
</div>

<script src="assets/subscribe-config.js"></script>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var email = (params.get("email") || "").trim();
  var token = params.get("t") || "";

  function show(id) {
    ["stateLoading", "stateDone", "stateError"].forEach(function (s) {
      document.getElementById(s).style.display = s === id ? "block" : "none";
    });
  }

  function done() {
    if (email) document.getElementById("doneEmail").textContent = email;
    show("stateDone");
  }

  if (!email) { done(); return; }

  var appUrl = window.CW_SUBSCRIBE_URL;
  if (appUrl) {
    // Apps Script doGet: ?action=unsubscribe&email=...&t=...
    var unsub = appUrl + "?action=unsubscribe&email=" + encodeURIComponent(email) + "&t=" + encodeURIComponent(token);
    fetch(unsub, { method: "GET", mode: "no-cors", credentials: "include" })
      .then(done)
      .catch(function () { show("stateError"); });
  } else {
    // Apps Script 미배포 — 낙관적 완료 표시 (배포 후 실제 DB 삭제)
    done();
  }
})();
</script>
</body>
</html>
